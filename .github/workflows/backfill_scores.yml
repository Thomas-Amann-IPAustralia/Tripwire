name: Backfill Semantic Scores

# One-off / occasional calibration job. Replays historical changes (Stages 5–6)
# to recover the bi-/cross-encoder scores that were never persisted, and writes
# a labelled calibration dataset to the score_backfill table plus a Markdown
# report. See src/backfill_scores.py and docs/stage_gate_efficacy_audit_2026-07-21.md.
#
# Manual trigger only — this is a backfill, not part of the daily pipeline.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Replay runs on/after this ISO date"
        required: false
        default: "2026-05-07"
      run_id:
        description: "Replay a single run only (optional, e.g. 2026-07-16-392)"
        required: false
        default: ""
      limit:
        description: "Cap the number of runs replayed (optional)"
        required: false
        default: ""
      log_level:
        description: "Logging level"
        required: false
        default: "INFO"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING

# Share the main pipeline's concurrency group so this never writes ipfr.sqlite
# at the same time as a scheduled pipeline run. Avoid dispatching it during the
# 01:00 UTC ingestion window, which writes the same database under a different
# group.
concurrency:
  group: tripwire-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill semantic scores
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest committed state
        run: git pull --rebase origin ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Reuse the pipeline's model cache so the weights are already present.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-base-v1-5-gte-reranker
          restore-keys: |
            hf-models-bge-base-v1-5-
            hf-models-bge-base-

      - name: Run score backfill
        run: |
          RUN_ID_ARG=""
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            RUN_ID_ARG="--run-id ${{ github.event.inputs.run_id }}"
          fi
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          python -m src.backfill_scores \
            --config tripwire_config.yaml \
            --since "${{ github.event.inputs.since || '2026-05-07' }}" \
            --log-level "${{ github.event.inputs.log_level || 'INFO' }}" \
            $RUN_ID_ARG \
            $LIMIT_ARG

      - name: Commit backfill results (database + report)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ipfr_corpus/ipfr.sqlite data/logs/ || true
          git diff --cached --quiet || git commit -m "chore: historical semantic-score backfill [run ${{ github.run_id }}] [skip ci]"
          git push origin ${{ github.ref_name }} || true

      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-backfill-${{ github.run_id }}
          path: data/logs/score_backfill_*.md
          retention-days: 90
          if-no-files-found: ignore
