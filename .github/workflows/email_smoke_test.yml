name: Email Smoke Test

# Live check that Tripwire can send (SMTP) and receive (IMAP) email using the
# repository secrets. Sends one labelled test message to the configured
# notification recipients and the feedback inbox, then confirms arrival.

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Send and receive a test email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
          CONTENT_OWNER_EMAIL: ${{ secrets.CONTENT_OWNER_EMAIL }}
          HEALTH_ALERT_EMAIL: ${{ secrets.HEALTH_ALERT_EMAIL }}
          TRIPWIRE_EMAIL_PHRASE: ${{ secrets.TRIPWIRE_EMAIL_PHRASE }}
          FEEDBACK_GMAIL_USER: ${{ secrets.FEEDBACK_GMAIL_USER }}
          FEEDBACK_GMAIL_APP_PASSWORD: ${{ secrets.FEEDBACK_GMAIL_APP_PASSWORD }}
        run: python .github/scripts/email_smoke_test.py
